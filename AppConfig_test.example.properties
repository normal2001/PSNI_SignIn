# Copy to AppConfig_test.properties in the project root, then edit and rebuild debug.
# All entries are optional starting defaults. Saved admin settings take priority.
# UTF-8 Java properties: no surrounding quotes; use \\ for a literal backslash.
SMB_HOST=
SMB_SHARE_NAME=
SMB_USERNAME=
SMB_PASSWORD=
SMB_DOMAIN=
SMB_EXPORT_ENABLED=false
ADMIN_PASSCODE=1234
SLACK_NOTIFICATIONS_ENABLED=false
SLACK_NOTIFICATION_TARGET=CHANNEL
SLACK_CHANNEL=
SLACK_BOT_TOKEN=
SLACK_USER_GROUP=
DATABASE_PATH=psni_sign_in.db
AUDIT_LOG_PATH=psni_sign_in_audit.txt
ERROR_LOG_PATH=psni_sign_in_error.txt
TIMESTAMP_PATTERN=yyyy-MM-dd HH:mm:ss
